<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- build: enhanced-ui v-20250820-0805 -->
  <meta name="x-build" content="enhanced-ui-v-20250820-0805" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' ry='20' fill='%230b0f1a'/%3E%3Ctext x='50' y='58' font-size='52' text-anchor='middle' fill='%23ffffff'%3E🦖%3C/text%3E%3C/svg%3E" />
  <title>3D Dino Game</title>
  <!-- External stylesheet served from public/ at site root by Vite -->
  <link rel="stylesheet" href="/style.css?v=dev-1" />
</head>
<body>
  <div id="game-container">
    <div id="flash"></div>
    <div class="hud">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="score">High: <span id="high-score">0</span></div>
      <div class="diff"><span style="opacity:.7;font-size:12px;">Difficulty</span><div class="diff-bar"><div id="diff-fill" class="diff-fill"></div></div></div>
      <div class="hint">Space/Up/W to jump • Tap/Click to jump • P to pause • H helpers</div>
      <button id="helpers-btn" class="secondary">Helpers</button>
    </div>
    <div class="center">
      <div id="start-screen" class="overlay visible">
        <div class="title">3D Dino Game</div>
        <div class="subtitle">Endless runner. Avoid obstacles. Collect coins.</div>
        <div class="btns">
          <button id="start-btn">Start</button>
          <button id="mute-btn" class="secondary">Mute</button>
        </div>
      </div>
      <div id="gameover-screen" class="overlay hidden">
        <div class="title">Game Over</div>
        <div class="subtitle">Your Score: <span id="final-score">0</span> • Best: <span id="final-high-score">0</span></div>
        <div class="btns">
          <button id="restart-btn">Play Again</button>
        </div>
      </div>
      <div id="pause-screen" class="overlay hidden">
        <div class="title">Paused</div>
        <div class="subtitle">Press P to resume</div>
        <div class="btns"><button id="resume-btn">Resume</button></div>
      </div>
    </div>
  </div>
  <div class="owner-badge" data-tip="Game by AY"><span>AY</span></div>
  <!-- Vite handles bare module imports (three, three/examples/jsm) from node_modules -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
