<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Dino Game</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b0f1a; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    /* Fill full viewport on mobile (account for dynamic UI chrome) */
    /* Order matters: least accurate first, most accurate last */
    #game-container { position: relative; width: 100%; height: 100vh; height: 100svh; height: 100dvh; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    .hud { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 16px; align-items: center; background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 10px; backdrop-filter: blur(4px); }
    .hud .score { font-weight: 700; letter-spacing: 0.5px; }
    .hud .hint { opacity: 0.75; font-size: 12px; }
    .hud .diff { display:flex; align-items:center; gap:6px; }
    .diff-bar { width: 120px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
    .diff-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #ef4444); border-radius: inherit; transition: width 160ms ease; }
    .center { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .center .overlay { pointer-events: auto; text-align: center; background: rgba(0,0,0,0.5); padding: 24px 28px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); opacity: 0; transform: translateY(8px); transition: opacity 200ms ease, transform 200ms ease; }
    .center .overlay.visible { opacity: 1; transform: translateY(0); }
    .title { font-size: 28px; margin: 0 0 8px; font-weight: 800; }
    .subtitle { margin: 0 0 16px; opacity: 0.8; }
    .btns { display: flex; gap: 10px; justify-content: center; }
    button { appearance: none; border: none; padding: 10px 14px; border-radius: 10px; background: #4f46e5; color: #fff; font-weight: 700; cursor: pointer; transition: transform 120ms ease, background 120ms ease; }
    button:hover { transform: translateY(-1px); background: #6366f1; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #94a3b8; }
    .hidden { display: none !important; }
    /* Score popup */
    .pop { position: absolute; z-index: 20; font-weight: 800; color: #ffd166; text-shadow: 0 2px 8px rgba(0,0,0,0.4); opacity: 0; transform: translateY(8px) scale(0.98); transition: opacity 300ms ease, transform 300ms ease; pointer-events: none; }
    .pop.show { opacity: 1; transform: translateY(-12px) scale(1); }
    /* Screen flash overlay */
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; transition: opacity 180ms ease; mix-blend-mode: screen; }
    #flash.show { opacity: var(--flash-alpha, 0.25); }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="flash"></div>
    <div class="hud">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="score">High: <span id="high-score">0</span></div>
      <div class="diff"><span style="opacity:.7;font-size:12px;">Difficulty</span><div class="diff-bar"><div id="diff-fill" class="diff-fill"></div></div></div>
      <div class="hint">Space/Up/W to jump • Tap/Click to jump • P to pause • H helpers</div>
      <button id="helpers-btn" class="secondary">Helpers</button>
    </div>
    <div class="center">
      <div id="start-screen" class="overlay visible">
        <div class="title">3D Dino Game</div>
        <div class="subtitle">Endless runner. Avoid obstacles. Collect coins.</div>
        <div class="btns">
          <button id="start-btn">Start</button>
          <button id="mute-btn" class="secondary">Mute</button>
        </div>
      </div>
      <div id="gameover-screen" class="overlay hidden">
        <div class="title">Game Over</div>
        <div class="subtitle">Your Score: <span id="final-score">0</span> • Best: <span id="final-high-score">0</span></div>
        <div class="btns">
          <button id="restart-btn">Restart</button>
        </div>
      </div>
      <div id="pause-screen" class="overlay hidden">
        <div class="title">Paused</div>
        <div class="subtitle">Press P to resume</div>
        <div class="btns"><button id="resume-btn">Resume</button></div>
      </div>
    </div>
  </div>
  <!-- Import map so example modules can import 'three' by bare specifier -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
