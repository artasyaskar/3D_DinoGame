<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- build: enhanced-ui v-20250820-0805 -->
  <meta name="x-build" content="enhanced-ui-v-20250820-0805" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' ry='20' fill='%230b0f1a'/%3E%3Ctext x='50' y='58' font-size='52' text-anchor='middle' fill='%23ffffff'%3E🦖%3C/text%3E%3C/svg%3E" />
  <title>3D Dino Game</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b0f1a; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    /* Fill full viewport on mobile (account for dynamic UI chrome) */
    /* Order matters: least accurate first, most accurate last */
    #game-container { position: relative; width: 100%; height: 100vh; height: 100svh; height: 100dvh; overflow: hidden; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    .hud { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 16px; align-items: center; background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 12px; backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(255,255,255,0.06); }
    .hud .score { font-weight: 700; letter-spacing: 0.5px; }
    .hud .hint { opacity: 0.75; font-size: 12px; }
    .hud .diff { display:flex; align-items:center; gap:6px; }
    .diff-bar { width: 120px; height: 6px; background: rgba(255,255,255,0.15); border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
    .diff-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #ef4444); border-radius: inherit; transition: width 160ms ease; }
    .center { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .center .overlay { pointer-events: auto; text-align: center; background: rgba(8,10,18,0.55); padding: 28px 32px; border-radius: 16px; box-shadow: 0 16px 44px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.06); opacity: 0; transform: translateY(8px) scale(0.98); transition: opacity 220ms ease, transform 220ms ease; backdrop-filter: blur(8px); }
    .center .overlay.visible { opacity: 1; transform: translateY(0); }
    .title { font-size: 30px; margin: 0 0 10px; font-weight: 900; letter-spacing: 0.3px; text-shadow: 0 2px 12px rgba(79,70,229,0.25); }
    .subtitle { margin: 0 0 16px; opacity: 0.8; }
    .btns { display: flex; gap: 12px; justify-content: center; }
    button { appearance: none; border: none; padding: 11px 16px; border-radius: 12px; background: linear-gradient(180deg, #6366f1, #4f46e5); color: #fff; font-weight: 800; cursor: pointer; transition: transform 120ms ease, filter 120ms ease; box-shadow: 0 6px 18px rgba(79,70,229,0.35); }
    button:hover { transform: translateY(-1px); filter: brightness(1.04); }
    button:active { transform: translateY(0); filter: brightness(0.98); }
    button.secondary { background: linear-gradient(180deg, #94a3b8, #64748b); box-shadow: 0 6px 18px rgba(100,116,139,0.35); }
    button.secondary:hover { filter: brightness(1.05); }
    .hidden { display: none !important; }
    /* Score popup */
    .pop { position: absolute; z-index: 20; font-weight: 800; color: #ffd166; text-shadow: 0 2px 8px rgba(0,0,0,0.4); opacity: 0; transform: translateY(8px) scale(0.98); transition: opacity 300ms ease, transform 300ms ease; pointer-events: none; }
    .pop.show { opacity: 1; transform: translateY(-12px) scale(1); }
    /* Screen flash overlay */
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; transition: opacity 180ms ease; mix-blend-mode: screen; }
    #flash.show { opacity: var(--flash-alpha, 0.25); }

    /* Owner badge (top-right) */
    .owner-badge { position: fixed; top: 12px; right: 12px; z-index: 50; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; letter-spacing: 0.5px; color: #0b0f1a; background: radial-gradient(120% 120% at 30% 20%, #a5b4fc 0%, #c4b5fd 45%, #fde68a 100%); box-shadow: 0 12px 28px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(255,255,255,0.6); user-select: none; cursor: default; }
    .owner-badge::after { content: attr(data-tip); position: absolute; top: 54px; right: 0; transform: translateX(10%); white-space: nowrap; background: rgba(0,0,0,0.65); color: #e5e7eb; font-weight: 700; font-size: 11px; padding: 6px 8px; border-radius: 8px; box-shadow: 0 8px 18px rgba(0,0,0,0.35); opacity: 0; pointer-events: none; transition: opacity 150ms ease, transform 150ms ease; }
    .owner-badge:hover::after { opacity: 1; transform: translateX(10%) translateY(0); }
    .owner-badge span { transform: translateY(1px); text-shadow: 0 1px 0 rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="flash"></div>
    <div class="hud">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="score">High: <span id="high-score">0</span></div>
      <div class="diff"><span style="opacity:.7;font-size:12px;">Difficulty</span><div class="diff-bar"><div id="diff-fill" class="diff-fill"></div></div></div>
      <div class="hint">Space/Up/W to jump • Tap/Click to jump • P to pause • H helpers</div>
      <button id="helpers-btn" class="secondary">Helpers</button>
    </div>
    <div class="center">
      <div id="start-screen" class="overlay visible">
        <div class="title">3D Dino Game</div>
        <div class="subtitle">Endless runner. Avoid obstacles. Collect coins.</div>
        <div class="btns">
          <button id="start-btn">Start</button>
          <button id="mute-btn" class="secondary">Mute</button>
        </div>
      </div>
      <div id="gameover-screen" class="overlay hidden">
        <div class="title">Game Over</div>
        <div class="subtitle">Your Score: <span id="final-score">0</span> • Best: <span id="final-high-score">0</span></div>
        <div class="btns">
          <button id="restart-btn">Restart</button>
        </div>
      </div>
      <div id="pause-screen" class="overlay hidden">
        <div class="title">Paused</div>
        <div class="subtitle">Press P to resume</div>
        <div class="btns"><button id="resume-btn">Resume</button></div>
      </div>
    </div>
  </div>
  <div class="owner-badge" data-tip="Game by AY"><span>AY</span></div>
  <!-- Vite handles bare module imports (three, three/examples/jsm) from node_modules -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
